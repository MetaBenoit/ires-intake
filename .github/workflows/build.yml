name: Build

# Per-repo caller for the MetaBenoit reusable frontend build + pull-deploy.
#   Build secrets:  VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
#   Deploy secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (upload + enqueue)
# Deploy runs on push to main/master and manual dispatch; PRs build-validate only.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: MetaBenoit/.github/.github/workflows/frontend-build.yml@main
    with:
      node-version: '20'
      working-directory: '.'
      deploy-asset: ires-intake
    secrets:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
